name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The build only reads the repository. Publishing needs more, so the deploy
# job asks for it on its own and nothing else holds it.
permissions:
  contents: read

# Never let two deploys race; queue instead, and don't cancel a run that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Fail here rather than after publishing if the export did not actually
      # produce the pages — a green deploy that serves a 404 is worse than a
      # red build.
      - name: Verify export
        run: |
          set -euo pipefail
          for lang in en ar ku; do
            for page in "" about/ projects/ projects/qasa/ contact/; do
              f="out/$lang/${page}index.html"
              [ -f "$f" ] || { echo "missing $f"; exit 1; }
            done
          done
          for f in out/index.html out/404.html out/.nojekyll; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          echo "export looks complete"
          node scripts/js-budget.mjs --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reads the Pages settings through the API, so it runs here, in the one
      # job that holds the Pages permission.
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
