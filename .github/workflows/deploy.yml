name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel a run that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Fail here rather than after publishing if the export did not actually
      # produce the pages — a green deploy that serves a 404 is worse than a
      # red build.
      - name: Verify export
        run: |
          set -euo pipefail
          for f in out/en/index.html out/ar/index.html out/ku/index.html \
                   out/en/projects/index.html out/index.html out/404.html out/.nojekyll; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          echo "export looks complete"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
